<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Cheap Finder{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

  <!-- Apply the saved theme before first paint so pages don't flash the wrong theme -->
  <script>
    try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
  </script>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            neutral: {
              950: '#0a0a0a',
              900: '#141414',
              800: '#262626',
            }
          }
        }
      }
    }
  </script>

  <!-- Inter font — only weights we actually use, swap avoids invisible text flash -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- HTMX — vendored locally, defer so it doesn't block page render -->
  <script src="/static/js/htmx.min.js" defer></script>

  <!-- Per-page extras (e.g. Chart.js on product detail only) -->
  {% block extra_head %}{% endblock %}

  <style>
    * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Light mode overrides */
    html:not(.dark) { background: #fafafa; }
    html:not(.dark) .light\:bg-white { background: #fff; }
    html:not(.dark) .light\:bg-neutral-100 { background: #f5f5f5; }
    html:not(.dark) .light\:border-neutral-200 { border-color: #e5e5e5; }
    html:not(.dark) .light\:border-neutral-400 { border-color: #a3a3a3; }
    html:not(.dark) .light\:text-neutral-900 { color: #0a0a0a; }
    html:not(.dark) .light\:text-neutral-800 { color: #262626; }
    html:not(.dark) .light\:text-neutral-400 { color: #a3a3a3; }
    html:not(.dark) .light\:text-neutral-600 { color: #525252; }
    html:not(.dark) .light\:text-neutral-500 { color: #737373; }
    html:not(.dark) .light\:text-neutral-700 { color: #404040; }
    html:not(.dark) .light\:bg-neutral-200 { background: #e5e5e5; }
    html:not(.dark) .light\:border-neutral-100 { border-color: #f5f5f5; }
    html:not(.dark) .light\:border-neutral-300 { border-color: #d4d4d4; }
    html:not(.dark) .light\:hover\:text-neutral-900:hover { color: #0a0a0a; }
    html:not(.dark) .light\:hover\:bg-neutral-100:hover { background: #f5f5f5; }
    html:not(.dark) .light\:hover\:bg-neutral-200:hover { background: #e5e5e5; }
    html:not(.dark) .light\:hover\:bg-neutral-300:hover { background: #d4d4d4; }
    html:not(.dark) .light\:hover\:border-neutral-400:hover { border-color: #a3a3a3; }

    /* Dark-only utilities that turn text invisible on a light background.
       Many templates use these without a light: counterpart, so fix them once here. */
    html:not(.dark) .hover\:text-white:hover { color: #0a0a0a; }
    html:not(.dark) .text-neutral-200 { color: #262626; }
    html:not(.dark) .text-neutral-300 { color: #404040; }

    /* Makes a link cover its nearest positioned ancestor (used by product cards) */
    .stretched-link::after { content: ''; position: absolute; inset: 0; z-index: 1; }
    .stretched-link:focus-visible::after { outline: 2px solid #22c55e; outline-offset: -2px; border-radius: 0.5rem; }

    /* Visible keyboard focus everywhere (mouse clicks don't trigger it) */
    a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid #22c55e; outline-offset: 2px;
    }
  </style>
</head>
<body class="bg-neutral-50 text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100 min-h-screen">
  {% include "components/nav.html" %}

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>

  <script>
    // Theme management
    function getTheme() {
      return localStorage.getItem('theme') || 'light';
    }

    function setTheme(theme) {
      localStorage.setItem('theme', theme);
      document.documentElement.classList.toggle('dark', theme === 'dark');
      updateThemeIcon(theme);
    }

    function toggleTheme() {
      setTheme(getTheme() === 'dark' ? 'light' : 'dark');
    }

    function updateThemeIcon(theme) {
      const darkIcon = document.getElementById('theme-icon-dark');
      const lightIcon = document.getElementById('theme-icon-light');
      if (theme === 'dark') {
        darkIcon.classList.remove('hidden');
        lightIcon.classList.add('hidden');
      } else {
        darkIcon.classList.add('hidden');
        lightIcon.classList.remove('hidden');
      }
    }

    // Init theme
    setTheme(getTheme());

    // Wishlist management (localStorage-based)
    function getWishlist() {
      try { return JSON.parse(localStorage.getItem('cf_wishlist') || '[]'); }
      catch(e) { return []; }
    }

    function isInWishlist(productId) {
      return getWishlist().includes(productId);
    }

    function toggleWishlist(productId, event) {
      if (event) { event.preventDefault(); event.stopPropagation(); }
      var list = getWishlist();
      var idx = list.indexOf(productId);
      if (idx >= 0) { list.splice(idx, 1); } else { list.push(productId); }
      localStorage.setItem('cf_wishlist', JSON.stringify(list));
      // Update heart icons
      document.querySelectorAll('[data-wishlist-id="' + productId + '"]').forEach(function(el) {
        var saved = list.includes(productId);
        el.classList.toggle('text-red-500', saved);
        el.classList.toggle('text-white', !saved);
        el.setAttribute('aria-pressed', saved ? 'true' : 'false');
      });
      updateWishlistBadge();
      // If on wishlist page, refresh the grid
      var wc = document.getElementById('wishlist-container');
      if (wc) {
        htmx.ajax('GET', '/wishlist/products', {target: '#wishlist-container', swap: 'innerHTML', values: {ids: getWishlist().join(',')}});
      }
    }

    function updateWishlistBadge() {
      var count = getWishlist().length;
      document.querySelectorAll('.wishlist-count-badge').forEach(function(badge) {
        badge.textContent = count;
        badge.style.display = count > 0 ? 'flex' : 'none';
      });
    }

    // On page load, mark wishlisted items and update badge
    document.addEventListener('DOMContentLoaded', function() {
      var list = getWishlist();
      list.forEach(function(id) {
        document.querySelectorAll('[data-wishlist-id="' + id + '"]').forEach(function(el) {
          el.classList.add('text-red-500');
          el.classList.remove('text-white');
          el.setAttribute('aria-pressed', 'true');
        });
      });
      updateWishlistBadge();
    });
  </script>
</body>
</html>
